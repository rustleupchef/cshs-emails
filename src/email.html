<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSHS Email Client</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #14182a;
            --ink-2: #1f2542;
            --paper: #fbf8f2;
            --paper-line: #e4ddc9;
            --text: #1c2333;
            --text-muted: #6b6455;
            --text-on-ink: #f2efe6;
            --text-on-ink-muted: #9aa0b8;
            --accent: #b23a48;
            --accent-dark: #8f2d39;
            --accent-soft: #f3e0e1;
            --focus: #c99a3d;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ink);
            background-image: radial-gradient(circle at 15% 0%, var(--ink-2), var(--ink) 55%);
            color: var(--text-on-ink);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 56px 20px 80px;
            display: flex;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 620px;
        }

        .letterhead {
            margin-bottom: 28px;
            padding: 0 4px;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-on-ink-muted);
            margin: 0 0 10px;
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: 34px;
            line-height: 1.15;
            margin: 0 0 8px;
            color: var(--text-on-ink);
        }

        .subtitle {
            margin: 0;
            font-size: 15px;
            color: var(--text-on-ink-muted);
        }

        .card {
            background: var(--paper);
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            padding: 8px 32px 32px;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.5s ease forwards 0.1s;
        }

        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; opacity: 1; transform: none; }
        }

        .status-banner {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-on-ink-muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            padding: 16px 18px;
        }

        .status-banner.is-error {
            color: #f2c9c9;
            border-color: rgba(178, 58, 72, 0.5);
            background: rgba(178, 58, 72, 0.12);
        }

        section.block {
            padding: 28px 0;
            border-bottom: 1px solid var(--paper-line);
        }

        section.block:last-of-type {
            border-bottom: none;
        }

        .step-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-dark);
            margin: 0 0 14px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field:last-child { margin-bottom: 0; }

        label.field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--paper-line);
            border-radius: 7px;
            padding: 11px 13px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--focus);
            box-shadow: 0 0 0 3px rgba(201, 154, 61, 0.22);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            line-height: 1.5;
        }

        .hint {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input {
            position: absolute;
            opacity: 0;
            inset: 0;
            margin: 0;
            cursor: pointer;
        }

        .radio-option span {
            display: block;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--paper-line);
            border-radius: 7px;
            padding: 11px 10px;
            transition: all 0.15s ease;
        }

        .radio-option input:checked + span {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .radio-option input:focus-visible + span {
            box-shadow: 0 0 0 3px rgba(201, 154, 61, 0.4);
        }

        .custom-fields {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed var(--paper-line);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-option {
            position: relative;
        }

        .checkbox-option input {
            position: absolute;
            opacity: 0;
            inset: 0;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-option span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--paper-line);
            border-radius: 7px;
            padding: 10px 12px;
            transition: all 0.15s ease;
        }

        .checkbox-option span::before {
            content: "";
            width: 14px;
            height: 14px;
            flex: 0 0 auto;
            border: 1.5px solid var(--paper-line);
            border-radius: 4px;
            background: #fff;
            transition: all 0.15s ease;
        }

        .checkbox-option input:checked + span {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .checkbox-option input:checked + span::before {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 3px var(--accent-soft);
        }

        .checkbox-option input:focus-visible + span {
            box-shadow: 0 0 0 3px rgba(201, 154, 61, 0.4);
        }

        .manifest {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 18px;
            padding: 14px 16px;
            background: var(--ink);
            border-radius: 7px;
        }

        .manifest-count {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-on-ink);
            font-variant-numeric: tabular-nums;
        }

        .manifest-count .label {
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-on-ink-muted);
            margin-left: 8px;
        }

        .link-button {
            background: none;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: var(--text-on-ink-muted);
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
        }

        .link-button:hover { color: var(--text-on-ink); }

        .recipient-list {
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
            max-height: 160px;
            overflow-y: auto;
            border-top: 1px solid var(--paper-line);
        }

        .recipient-list li {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12.5px;
            color: var(--text-muted);
            padding: 7px 0;
            border-bottom: 1px solid var(--paper-line);
        }

        .recipient-list.is-empty {
            border-top: none;
        }

        .recipient-list.is-empty::before {
            content: "No one matches the selected categories yet.";
            display: block;
            padding: 10px 0 0;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
        }

        .submit-button {
            width: 100%;
            margin-top: 24px;
            padding: 14px 16px;
            border: none;
            border-radius: 7px;
            background: var(--accent);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .submit-button:hover { background: var(--accent-dark); }

        .submit-button:disabled {
            background: #c7c0b0;
            cursor: not-allowed;
        }

        .submit-button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 154, 61, 0.5);
        }

        .form-status {
            margin-top: 12px;
            font-size: 13px;
            color: var(--accent-dark);
            min-height: 16px;
        }

        @media (max-width: 480px) {
            .checkbox-grid { grid-template-columns: 1fr; }
            h1 { font-size: 28px; }
            .card { padding: 4px 20px 24px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="letterhead">
            <p class="eyebrow">CSHS Dispatch</p>
            <h1>Email Client</h1>
            <p class="subtitle">Send an invitation or a custom message to your members.</p>
        </div>

        <div id="loadingStatus" class="status-banner">Loading your roster…</div>

        <form id="emailForm" class="card" style="display:none;" novalidate>

            <section class="block">
                <p class="step-label">01 — Authorize</p>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
                    <p class="hint">Confirms this dispatch is coming from you.</p>
                </div>
            </section>

            <section class="block">
                <p class="step-label">02 — Recipients</p>
                <div class="field">
                    <label class="field-label">Send to</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-option">
                            <input type="checkbox" name="category" value="officer">
                            <span>Officers</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="category" value="member">
                            <span>Members</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="category" value="candidate">
                            <span>Candidates</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="category" value="competition">
                            <span>Competition members</span>
                        </label>
                    </div>
                </div>

                <div class="manifest">
                    <span class="manifest-count"><span id="recipientCount">0</span><span class="label">selected</span></span>
                    <button type="button" id="togglePreview" class="link-button">View list</button>
                </div>
                <ul id="recipientList" class="recipient-list is-empty" style="display:none;"></ul>
            </section>

            <section class="block">
                <p class="step-label">03 — Message</p>
                <div class="field">
                    <label class="field-label">Version</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="version" value="invite" checked>
                            <span>Invite</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="version" value="custom">
                            <span>Custom</span>
                        </label>
                    </div>
                </div>

                <div id="customFields" class="custom-fields" style="display:none;">
                    <div class="field">
                        <label class="field-label" for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Email subject">
                    </div>
                    <div class="field">
                        <label class="field-label" for="header">Header</label>
                        <input type="text" id="header" placeholder="Header text shown at the top of the email">
                    </div>
                    <div class="field">
                        <label class="field-label" for="body">Body</label>
                        <textarea id="body" placeholder="The main message"></textarea>
                    </div>
                </div>
            </section>

            <button type="submit" class="submit-button" id="sendButton">Send email</button>
            <p id="formStatus" class="form-status"></p>
        </form>
    </div>

    <script>
        let groups = [];

        async function send(version, key, emails, subject = "", header = "", body = "") {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `/${version}`);

            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onload = function() {
                if (xhr.status == 200 && xhr.readyState === 4) {
                    alert(xhr.responseText);
                }
            }

            xhr.onerror = function() {
                alert(`Error: ${xhr.responseText}`);
            }

            const payload = {
                key,
                emails,
                subject,
                header,
                body
            };

            console.log(JSON.stringify(payload));

            xhr.send(JSON.stringify(payload));
        }

        function getSelectedEmails() {
            const checked = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(cb => cb.value);
            if (checked.length === 0) return [];
            const matches = groups.filter(g => checked.some(category => g[category]));
            return [...new Set(matches.map(g => g.name ? g.name : g.person))];
        }

        function updateRecipientPreview() {
            const emails = getSelectedEmails();

            document.getElementById('recipientCount').textContent = String(emails.length).padStart(2, '0');

            const listEl = document.getElementById('recipientList');
            listEl.innerHTML = '';
            listEl.classList.toggle('is-empty', emails.length === 0);
            emails.forEach(email => {
                const li = document.createElement('li');
                li.textContent = email;
                listEl.appendChild(li);
            });
        }

        function setFormStatus(message) {
            document.getElementById('formStatus').textContent = message || '';
        }

        document.addEventListener("DOMContentLoaded", async function() {
            fetch("https://sheets.wais-cshs.workers.dev/People")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok");
                    }
                    return response.json();
                })
                .then(data => {
                    const values = data.values.splice(1);
                    for (let row of values) {
                        let person = row[0];
                        let name = row[1];
                        let officer = row[2] == "TRUE";
                        let member = row[3] == "TRUE";
                        let candidate = row[4] == "TRUE";
                        let competition = row[5] == "TRUE";

                        groups.push({
                            person,
                            name,
                            officer,
                            member,
                            candidate,
                            competition
                        });
                    }

                    document.getElementById('loadingStatus').style.display = 'none';
                    document.getElementById('emailForm').style.display = 'block';
                    updateRecipientPreview();
                })
                .catch(error => {
                    console.error("Fetch operation failed:", error);
                    const loadingEl = document.getElementById('loadingStatus');
                    loadingEl.textContent = "Couldn't load the roster: " + error.message + ". Try refreshing the page.";
                    loadingEl.classList.add('is-error');
                });

            document.querySelectorAll('input[name="category"]').forEach(cb => {
                cb.addEventListener('change', updateRecipientPreview);
            });

            document.querySelectorAll('input[name="version"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    document.getElementById('customFields').style.display = this.value === 'custom' ? 'block' : 'none';
                });
            });

            document.getElementById('togglePreview').addEventListener('click', function() {
                const listEl = document.getElementById('recipientList');
                const willShow = listEl.style.display === 'none';
                listEl.style.display = willShow ? 'block' : 'none';
                this.textContent = willShow ? 'Hide list' : 'View list';
            });

            document.getElementById('emailForm').addEventListener('submit', function(e) {
                e.preventDefault();
                setFormStatus('');

                const password = document.getElementById('password').value;
                if (!password) {
                    setFormStatus('Enter the password before sending.');
                    return;
                }

                const version = document.querySelector('input[name="version"]:checked').value;
                const emails = getSelectedEmails();

                if (emails.length === 0) {
                    setFormStatus('Select at least one recipient category.');
                    return;
                }

                let subject = "", header = "", body = "";

                if (version === 'custom') {
                    subject = document.getElementById('subject').value.trim();
                    header = document.getElementById('header').value.trim();
                    body = document.getElementById('body').value.trim();

                    if (!subject || !header || !body) {
                        setFormStatus('Fill in the subject, header, and body for a custom email.');
                        return;
                    }
                }

                const sendButton = document.getElementById('sendButton');
                sendButton.disabled = true;
                sendButton.textContent = 'Sending…';

                send(version, password, emails, subject, header, body);

                setTimeout(() => {
                    sendButton.disabled = false;
                    sendButton.textContent = 'Send email';
                }, 1500);
            });
        });
    </script>
</body>
</html>
